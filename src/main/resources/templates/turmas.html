<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RateIF | Turmas</title><link rel="stylesheet" href="/css/style.css"></head>
<body class="app-body" data-page="turmas"><div class="app-layout"><aside class="sidebar"><a class="brand" href="/dashboard">Rate<span>IF</span></a><p class="sidebar-caption">Gestão acadêmica</p><nav class="nav"><a href="/dashboard">⌂ <span>Início</span></a><a class="active" href="/turmas">▦ <span>Turmas</span></a><a href="/vdc">◉ <span>Conselho de Classe</span></a></nav><div class="sidebar-foot">Web + Mobile<br><small>mesma base de dados</small></div></aside><main class="main-content"><header class="page-header"><div><p class="eyebrow">GESTÃO DE TURMAS</p><h1>Turmas</h1><p class="page-subtitle">Cadastre e mantenha a estrutura das turmas do RateIF.</p></div><div class="header-actions"><a class="profile-chip" href="/dashboard"><span th:text="${initial}">U</span><div><strong th:text="${nome}">Usuário</strong><small th:text="${perfil}">USUARIO</small></div></a><button class="btn outline" onclick="logout()">Sair</button></div></header>
<section class="module-grid"><article class="panel form-panel"><div class="panel-heading"><div><p class="eyebrow">CADASTRO</p><h2 id="turmaFormTitle">Nova turma</h2></div><button id="cancelTurmaEdit" class="icon-btn hidden" type="button">×</button></div><form id="turmaForm" class="form"><label>Nome da turma<input id="nomeTurma" required placeholder="Ex.: 3º B Desenvolvimento de Sistemas"></label><div class="form-two"><label>Ano letivo<input id="anoLetivo" type="number" min="2000" max="2200" value="2026" required></label><label>Turno<select id="turno"><option>Manhã</option><option>Tarde</option><option>Noite</option><option>Integral</option></select></label></div><label>Professor responsável<select id="professorId"><option value="">Não definido</option></select></label><button class="btn primary" type="submit">Salvar turma</button><div id="turmaMessage" class="message"></div></form></article><article class="panel list-panel"><div class="panel-heading"><div><p class="eyebrow">CATÁLOGO</p><h2>Turmas cadastradas</h2></div><span id="turmaCount" class="count-badge">0</span></div><div id="turmaList" class="data-list"><div class="empty-state">Carregando turmas...</div></div></article></section>
</main></div><script src="/js/app.js"></script></body></html>
