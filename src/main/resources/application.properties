spring.datasource.url=jdbc:mysql://localhost:3306/sistema_escolar
spring.datasource.username=[NOME DO USUARIO]
spring.datasource.password=[SENHA DO USUARIO]

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Google Auth (opcional para desenvolvimento). Substitua pelo Client ID do Google Cloud.
google.client-id=${GOOGLE_CLIENT_ID:}
