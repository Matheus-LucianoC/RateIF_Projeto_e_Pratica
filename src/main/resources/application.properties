# Banco de dados MySQL
# Pode usar as variáveis DB_URL, DB_USERNAME e DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sistema_escolar?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=[NOME]
spring.datasource.password=[SENHA]
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# O schema é criado/atualizado durante o desenvolvimento.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Google Auth (opcional).
google.client-id=${GOOGLE_CLIENT_ID:}

# API Mobile (React Native / Expo)
server.port=${SERVER_PORT:8080}
mobile.jwt.secret=${MOBILE_JWT_SECRET:rateif-mobile-development-secret-please-change-this-2026}
mobile.jwt.expiration-hours=${MOBILE_JWT_EXPIRATION_HOURS:8}
